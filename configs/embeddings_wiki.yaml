# Wikipedia subset. Not full English Wikipedia: this trains on an Apple M2 with 24 GB
# and no CUDA, and a from-scratch PyTorch SGNS runs one to two orders of magnitude
# slower than gensim's Cython. The subset size is set from a measured tokens-per-second
# number in Phase 3, not guessed here.
#
# k = 5 rather than 15. Mikolov et al. 2013 recommends 2 to 5 negative samples for
# large corpora, against 5 to 20 for small ones.

corpus: wikipedia-subset
subset_gb: null         # filled in from the measured throughput in Phase 3
objective: skipgram
dimension: 300
window: 5
negative_samples: 5
noise_power: 0.75
subsample_threshold: 1.0e-5
dynamic_window: true
min_count: 10
epochs: 3
batch_size: 4096
learning_rate: 2.5e-3
seed: 0
