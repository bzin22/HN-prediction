# Full eligible English Wikipedia from the 20231101 snapshot. Both objectives read
# the same corpus. There is no time limit or throughput-derived corpus-size limit.
#
# k = 5 rather than 15. Mikolov et al. 2013 recommends 2 to 5 negative samples for
# large corpora, against 5 to 20 for small ones.

corpus: wikipedia-20231101.en
objective: skipgram
dimension: 300
window: 5
negative_samples: 5
noise_power: 0.75
subsample_threshold: 1.0e-5
dynamic_window: true
min_count: 10
epochs: 3
batch_size: 4096
learning_rate: 2.5e-3
seed: 0
