name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.12 is the floor the project supports. Testing the floor catches anything that
      # only works on a newer interpreter. The dev machine runs 3.13.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check

      - name: Format check
        run: ruff format --check

      - name: Import check
        run: python -c "import hn_upvotes; print(hn_upvotes.__version__)"

      - name: Test
        run: pytest -v

  # These tests need the train extra, which the base install deliberately does not carry.
  # They skip entirely under `check`, so without this job they would never run in CI. Split
  # into its own job so the fast checks are not held up behind a torch download.
  train-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # The CPU wheel, because there is no GPU on a runner and the CUDA build is 2 GB.
      - name: Install with the train extra
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev,train]" "duckdb>=1.0"

      # xgboost's Linux wheel bundles its own OpenMP runtime, so the early stopping tests
      # run here without the libomp workaround `make tune-xgboost` needs on macOS.
      - name: Test the embeddings and the early stopped rung
        run: |
          pytest -v tests/test_embeddings_sgns.py tests/test_embeddings_chain.py tests/test_embeddings_corpora.py \
            tests/test_embeddings_full_run.py tests/test_learning_rate.py tests/test_early_stopped_xgboost.py
