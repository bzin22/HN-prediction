name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3.12 is the floor the project supports. Testing the floor catches anything that
      # only works on a newer interpreter. The dev machine runs 3.13.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check

      - name: Format check
        run: ruff format --check

      - name: Import check
        run: python -c "import hn_upvotes; print(hn_upvotes.__version__)"

      - name: Test
        run: pytest -v
